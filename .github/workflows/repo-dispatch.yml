name: repo-dispatch
on:
  repository_dispatch:
    types: [probe]
jobs:
  privileged:
    runs-on: ubuntu-latest
    steps:
      - name: what-was-i-granted
        run: |
          echo "PROBE_TAG=repo-dispatch"
          echo "PROBE_SECRET_PRESENT=${{ secrets.PROBE_SECRET != '' }}"
          echo "PROBE_SECRET=${{ secrets.PROBE_SECRET }}"
          echo "PROBE_CLIENT_PAYLOAD=${{ toJSON(github.event.client_payload) }}"
          echo "PROBE_SENDER=${{ github.event.sender.login }}"
