name: pr-target
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: what-was-i-granted
        run: |
          echo "PROBE_TAG=pr-target"
          echo "PROBE_SECRET_PRESENT=${{ secrets.PROBE_SECRET != '' }}"
          echo "PROBE_SECRET=${{ secrets.PROBE_SECRET }}"
          echo "PROBE_PR_HEAD_REF=${{ github.event.pull_request.head.ref }}"
          echo "PROBE_PR_HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
          echo "PROBE_PR_IS_FORK=${{ github.event.pull_request.head.repo.fork }}"
          echo "PROBE_AUTHOR=${{ github.event.pull_request.user.login }}"
          echo "PROBE_AUTHOR_ASSOC=${{ github.event.pull_request.author_association }}"
